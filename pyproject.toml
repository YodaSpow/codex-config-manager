[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-config-manager"
version = "0.1.0"
description = "Deterministic publisher and consumer for a bounded global Codex configuration."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "YodaSpow" }]
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
bootstrap = [
  "setuptools==80.9.0",
]
development = [
  "pip-tools==7.6.1",
  "pytest==9.1.1",
]

[project.scripts]
codex-config-manager-publisher = "codex_config_manager.cli:publisher_main"
codex-config-manager-consumer = "codex_config_manager.cli:consumer_main"
codex-config-manager-bootstrap = "codex_config_manager.cli:bootstrap_main"
codex-config-manager-install = "codex_config_manager.cli:install_main"
codex-config-manager-uninstall = "codex_config_manager.cli:uninstall_main"
codex-config-manager-status = "codex_config_manager.cli:status_main"
codex-config-manager-validate = "codex_config_manager.cli:validate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
